    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: #0a0b08;
      color: #e9ead8;
      font-family: "Epilogue", system-ui, sans-serif;
      overflow: hidden;
    }

    main {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 1.5rem;
    }

    @media (min-width: 640px) {
      main {
        padding: 3rem;
      }
    }

    /* Soft drifting lime glow */
    .glow {
      position: absolute;
      top: -25%;
      right: -25%;
      width: 90vmax;
      height: 90vmax;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(180, 191, 58, 0.10),
        transparent 65%
      );
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from {
        transform: translate(-10%, 10%);
      }

      to {
        transform: translate(15%, -10%);
      }
    }

    .role {
      position: relative;
      font-family: "Azeret Mono", ui-monospace, monospace;
      font-size: 14px;
      color: #cfd3b9;
      opacity: 0;
      animation: fadeIn 0.8s ease 1.2s forwards;
    }

    .role .dot {
      color: #b4bf3a;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    h1 {
      position: relative;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 0.86;
      letter-spacing: -0.045em;
      font-size: clamp(3.5rem, min(21vw, 27vh), 15rem);
    }

    /* Each line is masked so the word slides into view */
    .line {
      display: block;
      overflow: hidden;
      padding-bottom: 0.04em;
    }

    .word {
      display: block;
      transform: translateY(105%);
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      background: linear-gradient(
        100deg,
        #e9ead8 0%,
        #e9ead8 40%,
        #d9e36a 48%,
        #b4bf3a 50%,
        #d9e36a 52%,
        #e9ead8 60%,
        #e9ead8 100%
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .line:nth-child(1) .word {
      animation:
        rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards,
        sweep 9s ease-in-out infinite;
    }

    .line:nth-child(2) .word {
      animation:
        rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.29s forwards,
        sweep 9s ease-in-out infinite;
    }

    .line:nth-child(3) .word {
      animation:
        rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.43s forwards,
        sweep 9s ease-in-out infinite;
    }

    @keyframes rise {
      to {
        transform: translateY(0);
      }
    }

    @keyframes sweep {
      0% {
        background-position: 100% 0;
      }

      60%,
      100% {
        background-position: 0% 0;
      }
    }

    /* Blinking build cursor */
    .cursor {
      display: inline-block;
      width: 0.12em;
      height: 0.72em;
      margin-left: 0.06em;
      background: #b4bf3a;
      transform: translateY(0.02em);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow,
      .cursor {
        animation: none;
      }

      .word {
        animation: none !important;
        transform: none;
      }

      .role {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="glow" aria-hidden="true"></div>

    <p class="role">
      <span class="dot">●</span>&nbsp; software engineer
    </p>

    <h1 aria-label="Rahmat Rasyidi Hakim">
      <span class="line">
        <span class="word">Rahmat</span>
      </span>

      <span class="line">
        <span class="word">Rasyidi</span>
      </span>

      <span class="line">
        <span class="word">Hakim<span class="cursor" aria-hidden="true"></span></span>
      </span>
    </h1>
  </main>
</body>
</html>
